# Other spellings of each club (FotMob's short names, headlines, the model's
# output, sign-up form answers), so they all resolve to the name above.
# Spaces, case, accents and a trailing "FC" are ignored when matching.
aliases:
  Manchester United: [Man United, Man Utd, 맨유, 맨체스터 유나이티드]
  Liverpool: [리버풀]
  Chelsea: [첼시]
  Arsenal: [아스날, 아스널]
  Manchester City: [Man City, 맨시티, 맨체스터 시티]
  Tottenham Hotspur: [Tottenham, Spurs, 토트넘, 토트넘 홋스퍼]
  # Never plain "Paris": "FC" is ignored, so it would also match Paris FC.
  Paris Saint-Germain: [PSG, Paris SG, Paris St-Germain, 파리 생제르맹, 파리 생제르망, 피에스지]
  Barcelona: [Barca, FC Barcelona, 바르셀로나, 바르사, 바르샤]
  Real Madrid: [레알 마드리드, 레알]
  Atletico Madrid: [Atletico, Atleti, Atletico de Madrid, 아틀레티코 마드리드, 아틀레티코, AT 마드리드]
  Bayern Munich: [Bayern München, Bayern, FC Bayern, 바이에른 뮌헨, 바이에른, 뮌헨]

# How each club's name is said in Korean, so a particle after the English
# name agrees with it: "Arsenal과" (아스널), "Chelsea와" (첼시),
# "Arsenal로" (ㄹ takes 로). Used by summarizers/korean.py on the model's
# output; a club missing here is left as the model wrote it.
