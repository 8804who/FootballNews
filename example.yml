# Few-shot examples. Every club, player, manager and headline in this file is
# FICTIONAL and shows FORMAT ONLY: real names here used to leak into
# subscribers' newsletters (Aug–Oct 2026). evaluate/gate.py flags any edition
# that contains a name from this file, so keep them obviously made up.
# The outputs are also the model's best guide to the voice (prompt.yml):
# plain 합쇼체, concrete facts, no long dashes or arrows, no stock phrases.

matches_report:
  - input: |
      Team: Example FC
      Venue: Home
      Match: Example FC vs Demo United
      Score: 3-1
      Result: Example FC 3 - 1 Demo United (Example FC won)
      Key Events:
      - 15' Example FC: Goal by Alex Sample (1 - 0)
      - 32' Demo United: Goal by Chris Demo (1 - 1)
      - 45' Example FC: Goal by Jordan Placeholder (2 - 1)
      - 78' Example FC: Goal by Taylor Mock (3 - 1)
    output: |
      ## 🏆 이번 주 헤드라인
      **Placeholder의 한 방, 동점은 13분 천하였습니다**

      ## ⭐ 이번 주 베스트 경기
      Example FC가 홈에서 Demo United를 3-1로 꺾었습니다. 15분 Alex Sample이 골문을 열었고, 32분 Chris Demo에게 동점골을 맞았지만 그 균형은 오래가지 않았습니다. 전반 종료 직전 Jordan Placeholder가 다시 앞서가는 골을 넣었고, 78분 Taylor Mock이 쐐기를 박았습니다. **한 번 따라잡힌 뒤가 더 무서운 팀이었습니다.**

      ## 📊 한눈에 보는 스코어보드
      | 경기 | 스코어 | 한 줄 요약 |
      |------|--------|----------|
      | Example FC vs Demo United | 3-1 | 동점을 내주고도 13분 만에 다시 앞섰습니다 |
      ---
  - input: |
      Team: Mock City
      Venue: Away
      Match: Sample Town vs Mock City
      Score: 0-2
      Result: Sample Town 0 - 2 Mock City (Mock City won)
      Key Events:
      - 23' Mock City: Goal by Riley Stub (0 - 1)
      - 67' Mock City: Goal by Casey Dummy (0 - 2)
    output: |
      ## 🏆 이번 주 헤드라인
      **Stub이 열고 Dummy가 잠갔습니다**

      ## ⭐ 이번 주 베스트 경기
      Mock City가 Sample Town 원정에서 2-0으로 이겼습니다. 23분 Riley Stub이 선제골로 문을 열었고, 67분 Casey Dummy가 한 골을 더 보태며 자물쇠를 채웠습니다. 90분 내내 리드를 한 번도 내주지 않은, 군더더기 없는 원정이었습니다 ✅

      ## 📊 한눈에 보는 스코어보드
      | 경기 | 스코어 | 한 줄 요약 |
      |------|--------|----------|
      | Sample Town vs Mock City | 0-2 | 원정 무실점, 두 골이면 충분했습니다 |
      ---

transfers_and_news_report:
  - input: |
      ### Official Transfers
      Team: Example FC
      Transfers:
      - **Player:** Alex Sample **Type:** Example FC -> Demo United **Date:** 2000-01-01

      ### News & Rumors
      - [N1] 2000-01-02 · BBC · 보도 · Example FC in race with Demo United to sign Jordan Placeholder
        요약: Example FC and Demo United have both made enquiries about the 22-year-old midfielder, whose contract expires in the summer.
      - [N2] 2000-01-03 · Sky Sports · 가십 · Example FC manager Sam Fictional asked whether he will honour his contract - Paper Talk
    output: |
      ## 🔁 이적 & 뉴스
      ### ✅ 확정 소식
      - **Alex Sample, Demo United행 확정** (FotMob 공식)
        Alex Sample이 Example FC를 떠나 Demo United 유니폼을 입습니다. 두 팀이 다시 만나는 날, 친정을 상대하는 Sample이 가장 바쁠 겁니다.

      ### 🧪 루머
      - **Jordan Placeholder 영입전, 이번엔 Demo United와 정면 대결** (보도)
        두 클럽이 이번 여름 계약이 끝나는 22세 미드필더 Jordan Placeholder 측에 나란히 문의를 넣었습니다. 방금 Alex Sample을 주고받은 두 팀이 이번엔 같은 선수를 두고 경쟁합니다. [N1]
      - **Sam Fictional 감독, 계약을 끝까지 지킬까** (가십)
        Sam Fictional 감독이 계약 기간을 채울지 질문받았다는 이야기가 가십 칼럼에 실렸습니다. 감독 거취가 입에 오르내리기 시작했습니다. [N2]
  - input: |
      ### Official Transfers
      (none this week)

      ### News & Rumors
      - [N1] 2000-01-04 · Sky Sports · 보도 · Sample Town teenager Chris Demo scores sensational U19 goal from inside own half
        요약: The 17-year-old forward ran from inside his own half to score for his country's under-19 side.
      - [N2] 2000-01-05 · BBC · 보도 · Sample Town confirm Riley Stub will miss six weeks with hamstring injury
        요약: The defender was hurt in Saturday's win and will be out until the new year, the club said.
      - [N3] 2000-01-05 · BBC · 보도 · Sample Town v Mock City: preview, team news and prediction
    output: |
      ## 🔁 이적 & 뉴스
      ### ✅ 확정 소식
      - **Riley Stub, 햄스트링 부상으로 6주 결장** (보도)
        토요일 승리 경기에서 다친 수비수 Riley Stub이 새해까지 돌아오지 못한다고 구단이 발표했습니다. 연말 빡빡한 일정을 수비수 한 명 없이 버텨야 합니다. [N2]

      ### 🎭 드라마 앵글
      - **17세 Chris Demo, 하프라인 뒤에서 출발한 원더골** (보도)
        Sample Town 유망주 Chris Demo가 U19 대표팀 경기에서 자기 진영부터 혼자 공을 몰고 가 골망을 흔들었습니다. 이름을 외워 둘 때가 됐습니다 🎯 [N1]
