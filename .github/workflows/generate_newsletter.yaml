name: generate_newsletter

on:
  # Started by collect_news after Monday's collection succeeds. Run it by hand
  # to regenerate; it only emails subscribers if send_after is ticked.
  workflow_dispatch:
    inputs:
      send_after:
        description: Start send_mail when the newsletter is ready
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # lets this run start send_mail

jobs:
  generate_newsletter:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_CLOUD_EMAIL: ${{ secrets.GOOGLE_CLOUD_EMAIL }}
      GOOGLE_CLOUD_SPREADSHEET_URL: ${{ secrets.GOOGLE_CLOUD_SPREADSHEET_URL }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download this edition's football data from GCS
        run: |
          mkdir -p datas/fotmob datas/news_rss
          # The edition covers last Monday 00:00 UTC to this Monday 00:00 UTC
          # (edition.py), and collect_news.py names folders by the day it runs
          # and looks 3 days back, so the edition's matches sit in the folders
          # from last Monday through today. One extra day covers a re-run on
          # Tuesday.
          for i in $(seq 0 8); do
            DATE=$(date -d "-${i} days" +%Y%m%d)
            gcloud storage cp -r \
              gs://my-football-news/football-news/datas/fotmob/${DATE} \
              datas/fotmob/ || true
            gcloud storage cp -r \
              gs://my-football-news/football-news/datas/news_rss/${DATE} \
              datas/news_rss/ || true
          done

      - name: Generate newsletter
        run: |
          python generate_newsletter.py

      # summary.json is what the dashboard shows and keeps as history, so a
      # week is scored once, by the metric version that was live that week.
      # --judge adds the LLM faithfulness check (~$0.01 per edition).
      - name: Evaluate newsletter
        continue-on-error: true
        run: |
          python evaluate/evaluate_main.py \
            --date $(date +%Y%m%d) --judge \
            --output datas/evaluation/$(date +%Y%m%d)/report.md \
            --json-output datas/evaluation/$(date +%Y%m%d)/summary.json

      # Writes gate.json for the dashboard. Report-only: a club that fails a
      # check is still sent, so this step can't stop the newsletter either.
      - name: Check each edition
        continue-on-error: true
        run: |
          python evaluate/gate.py --date $(date +%Y%m%d)

      # Copy into the parent prefix: copying onto an existing
      # newsletter/{date} prefix would nest a re-run under {date}/{date}/.
      - name: Upload newsletter to GCS
        run: |
          gcloud storage cp -r datas/newsletter/$(date +%Y%m%d) \
            gs://my-football-news/football-news/datas/newsletter/

      - name: Upload evaluation report to GCS
        continue-on-error: true
        run: |
          gcloud storage cp -r datas/evaluation/$(date +%Y%m%d) \
            gs://my-football-news/football-news/datas/evaluation/

      - name: Start send_mail
        if: inputs.send_after
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run send_mail.yaml --repo "${{ github.repository }}"

      - name: Alert on failure
        if: failure()
        run: |
          python notify.py --subject "generate_newsletter failed" --body "No newsletter was sent. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
